---
name: Release plugins

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-upload. Note: GitHub keeps at most one pending
  # run per group, so a third push while one run is active and one pending
  # replaces the pending run; re-release a skipped bump via workflow_dispatch.
  cancel-in-progress: false

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_ref:
        description: >-
          Commit/ref to compare against. Plugins whose marketplace.json version
          differs from this ref are (re)released; existing releases and assets
          are skipped. Empty = HEAD~1.
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base ref
        id: base
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
        run: python3 .github/scripts/resolve_base_ref.py

      - name: Detect version changes
        id: detect
        shell: bash
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: python3 .github/scripts/check_releases.py

      - name: Save release plan
        if: steps.detect.outputs.has_releases == 'true'
        shell: bash
        env:
          RELEASES_JSON: ${{ steps.detect.outputs.releases }}
        run: |
          mkdir -p .ci-outputs
          printf '%s' "$RELEASES_JSON" > .ci-outputs/releases.json

      - name: Create releases
        if: steps.detect.outputs.has_releases == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/create_releases.py

      - name: Install Rust toolchain
        if: steps.detect.outputs.has_releases == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Build and attach Rust binary assets to GitHub release
        if: steps.detect.outputs.has_releases == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          python3 .github/scripts/build_binaries.py

  discover:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base ref
        id: base
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
        run: python3 .github/scripts/resolve_base_ref.py

      - name: Discover plugins with Dockerfile + per-plugin change detection
        id: find
        shell: bash
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: |
          set -euo pipefail
          plugins='[]'
          any=false
          changed_files="$RUNNER_TEMP/changed-files.txt"
          if [[ -n "$BASE_REF" ]]; then
            git diff --name-only "$BASE_REF" HEAD > "$changed_files"
          fi
          for df in plugins/*/docker/Dockerfile plugins/*/Dockerfile; do
            [[ -f "$df" ]] || continue
            if [[ "$df" == */docker/Dockerfile ]]; then
              plugin_dir="$(dirname "$(dirname "$df")")"
            else
              plugin_dir="$(dirname "$df")"
            fi
            plugin_name="$(basename "$plugin_dir")"
            context="$(dirname "$df")"
            image="openfantasy/${plugin_name}"

            # No base (root commit) -> treat as changed.
            changed=true
            if [[ -n "$BASE_REF" ]] && ! grep -qE "^plugins/${plugin_name}/(docker/|scripts/)" "$changed_files"; then
              changed=false
            fi
            [[ "$changed" == "true" ]] || continue

            entry=$(jq -nc --arg name "$plugin_name" --arg df "$df" --arg ctx "$context" --arg img "$image" \
                    '{name:$name, dockerfile:$df, context:$ctx, image:$img}')
            plugins=$(jq -c --argjson e "$entry" '. + [$e]' <<<"$plugins")
            any=true
          done
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "Discovered: $plugins"

  build-docker:
    name: build-docker (${{ matrix.plugin.name }})
    needs: [discover]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: cloud
          endpoint: openfantasy/builder

      - name: Get version from Dockerfile LABEL
        id: get-version
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.plugin.dockerfile }}
        run: |
          echo "version=$(grep 'LABEL version=' "$DOCKERFILE" | sed 's/.*version="\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.plugin.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push (${{ matrix.plugin.name }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.plugin.context }}
          file: ${{ matrix.plugin.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            nvd_api_key=${{ secrets.NVD_API_KEY }}
          cache-from: type=registry,ref=${{ matrix.plugin.image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.plugin.image }}:buildcache,mode=max
