---
name: Release plugins

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    container:
      image: node:22-bookworm
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
    steps:
      - name: Install system dependencies + Docker CLI + buildx
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git bash python3 coreutils ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
          apt-get update && apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin

      - name: Detect available platforms
        run: |
          if docker run --rm --privileged tonistiigi/binfmt --install all 2>/dev/null; then
            echo "QEMU registered — creating multi-arch builder"
            docker buildx create --name multiarch --driver docker-container --use
            docker buildx inspect --bootstrap
            echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          else
            echo "QEMU not available — building amd64 only"
            echo "PLATFORMS=linux/amd64" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect version changes
        id: detect
        shell: bash
        env:
          BASE_REF: HEAD~1
        run: python3 .forgejo/scripts/check_releases.py

      - name: Save release plan
        if: steps.detect.outputs.has_releases == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          RELEASES_JSON: ${{ steps.detect.outputs.releases }}
        run: |
          mkdir -p .ci-outputs
          printf '%s' "$RELEASES_JSON" > .ci-outputs/releases.json

      - name: Create tags and releases
        if: steps.detect.outputs.has_releases == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .forgejo/scripts/create_releases.py

      - name: Build and push Docker images
        if: steps.detect.outputs.has_releases == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 .forgejo/scripts/build_images.py
