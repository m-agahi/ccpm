---
name: Release plugins

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    container:
      image: node:22-alpine
    steps:
      - name: Install system dependencies
        run: apk add --no-cache git bash python3 coreutils ca-certificates

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect version changes
        id: detect
        shell: bash
        env:
          BASE_REF: HEAD~1
        run: python3 .forgejo/scripts/check_releases.py

      - name: Save release plan
        if: steps.detect.outputs.has_releases == 'true'
        shell: bash
        env:
          RELEASES_JSON: ${{ steps.detect.outputs.releases }}
        run: |
          mkdir -p .ci-outputs
          printf '%s' "$RELEASES_JSON" > .ci-outputs/releases.json

      - name: Create tags and releases
        if: steps.detect.outputs.has_releases == 'true'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .forgejo/scripts/create_releases.py

  build-images:
    needs: release
    runs-on: docker
    container:
      image: node:22-bookworm
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
    steps:
      - name: Install Docker CLI
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg python3
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
          apt-get update && apt-get install -y --no-install-recommends docker-ce-cli

      - name: Verify Docker access
        run: docker info

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect version changes
        id: detect
        shell: bash
        env:
          BASE_REF: HEAD~1
        run: python3 .forgejo/scripts/check_releases.py

      - name: Save release plan
        if: steps.detect.outputs.has_releases == 'true'
        shell: bash
        env:
          RELEASES_JSON: ${{ steps.detect.outputs.releases }}
        run: |
          mkdir -p .ci-outputs
          printf '%s' "$RELEASES_JSON" > .ci-outputs/releases.json

      - name: Build and push Docker images
        if: steps.detect.outputs.has_releases == 'true'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 .forgejo/scripts/build_images.py
