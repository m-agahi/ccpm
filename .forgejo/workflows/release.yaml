---
name: Release plugins

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git bash python3 coreutils ca-certificates curl

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect version changes
        id: detect
        shell: bash
        env:
          BASE_REF: HEAD~1
        run: python3 .forgejo/scripts/check_releases.py

      - name: Save release plan
        if: steps.detect.outputs.has_releases == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          RELEASES_JSON: ${{ steps.detect.outputs.releases }}
        run: |
          mkdir -p .ci-outputs
          printf '%s' "$RELEASES_JSON" > .ci-outputs/releases.json

      - name: Create tags and releases
        if: steps.detect.outputs.has_releases == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .forgejo/scripts/create_releases.py

      - name: Install Rust toolchain
        if: steps.detect.outputs.has_releases == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          apt-get install -y --no-install-recommends gcc gcc-aarch64-linux-gnu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-unknown-linux-gnu

      - name: Build and attach Rust binary assets to Codeberg release
        if: steps.detect.outputs.has_releases == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          python3 .forgejo/scripts/build_binaries.py

  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - name: Install jq
        run: apt-get update -qq && apt-get install -y --no-install-recommends jq

      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Discover plugins with Dockerfile + per-plugin change detection
        id: find
        shell: bash
        run: |
          set -euo pipefail
          plugins='[]'
          any=false
          for df in plugins/*/docker/Dockerfile plugins/*/Dockerfile; do
            [[ -f "$df" ]] || continue
            if [[ "$df" == */docker/Dockerfile ]]; then
              plugin_dir="$(dirname "$(dirname "$df")")"
            else
              plugin_dir="$(dirname "$df")"
            fi
            plugin_name="$(basename "$plugin_dir")"
            context="$(dirname "$df")"
            image="openfantasy/${plugin_name}"

            changed=true
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              if ! git diff --name-only HEAD~1 HEAD | grep -qE "^plugins/${plugin_name}/(docker/|scripts/)"; then
                changed=false
              fi
            fi
            [[ "$changed" == "true" ]] || continue

            entry=$(jq -nc --arg name "$plugin_name" --arg df "$df" --arg ctx "$context" --arg img "$image" \
                    '{name:$name, dockerfile:$df, context:$ctx, image:$img}')
            plugins=$(jq -c --argjson e "$entry" '. + [$e]' <<<"$plugins")
            any=true
          done
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "Discovered: $plugins"

  build-docker:
    name: build-docker (${{ matrix.plugin.name }})
    needs: [discover]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: docker:cli
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    steps:
      - name: Install minimal tools
        run: apk add --no-cache bash python3 nodejs git curl

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Log in to Docker Hub
        uses: https://github.com/docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud)
        uses: https://github.com/docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: openfantasy/builder

      - name: Get version from Dockerfile LABEL
        id: get-version
        run: |
          echo "version=$(grep 'LABEL version=' ${{ matrix.plugin.dockerfile }} | sed 's/.*version="\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: https://github.com/docker/metadata-action@v6
        with:
          images: ${{ matrix.plugin.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push (${{ matrix.plugin.name }})
        uses: https://github.com/docker/build-push-action@v7
        with:
          context: ${{ matrix.plugin.context }}
          file: ${{ matrix.plugin.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            nvd_api_key=${{ secrets.NVD_API_KEY }}
          cache-from: type=registry,ref=${{ matrix.plugin.image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.plugin.image }}:buildcache,mode=max
