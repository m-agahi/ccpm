name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.check.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Check Docker changes
        id: check
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && \
             ! git diff --name-only HEAD~1 HEAD | grep -qE '^plugins/code-review/(docker/|scripts/)'; then
            echo "docker=false" >> "$GITHUB_OUTPUT"
          else
            echo "docker=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [changes]
    runs-on: ubuntu-latest
    # Push on version tags and direct pushes to master (not PRs)
    # On master: only when Docker-relevant files changed; on version tags: always
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.docker == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: cloud
          endpoint: openfantasy/builder

      - name: Get version from Dockerfile
        id: get-version
        run: |
          echo "version=$(grep 'LABEL version=' plugins/code-review/docker/Dockerfile | sed 's/.*version="\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: openfantasy/code-review
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: plugins/code-review/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-based BuildKit cache on DockerHub. Reused across runs on
          # the same builder; survives runner restarts unlike actions/cache.
          cache-from: type=registry,ref=openfantasy/code-review:buildcache
          cache-to: type=registry,ref=openfantasy/code-review:buildcache,mode=max
