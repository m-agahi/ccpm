[package]
name = "repo-indexer"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "repo-indexer"
path = "src/main.rs"

[dependencies]
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-go = "0.21"
tree-sitter-java = "0.21"
tree-sitter-php = "0.22"
rayon = "1"
log = "0.4"
env_logger = "0.11"
